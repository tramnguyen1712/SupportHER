<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SupportHER - Register</title>

  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#2f3a4a" />

  <link rel="icon" type="image/png" href="/images/icon-192.png" />
  <link rel="apple-touch-icon" href="/images/icon-192.png" />

  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/register.css" />
</head>

<body class="register">
  <main class="page">
    <header class="topbar">
      <a class="btn outline" href="/"> Back</a>
      <div class="brand">SupportHER</div>
      <div style="width: 90px;"></div>
    </header>

    <section class="cardBlock">
      <h1 class="pageTitle">Create an Account</h1>
      <p class="pageSub">
        Register to save favorites and submit businesses.
      </p>

      <form id="registerForm" class="form">
        <div class="field">
          <label for="fullName">Full Name</label>
          <input id="fullName" name="fullName" type="text" placeholder="Tram Nguyen" required />
          <div class="error" id="nameError"></div>
        </div>

        <div class="field">
          <label for="email">Username or Email</label>
          <input id="email" name="email" type="text" placeholder="tramnguyen" required />
          <div class="error" id="emailError"></div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="At least 8 characters" required />
          <div class="error" id="passwordError"></div>
        </div>

        <div class="field">
          <label for="confirmPassword">Confirm Password</label>
          <input id="confirmPassword" name="confirmPassword" type="password" placeholder="Re-enter your password" required />
          <div class="error" id="confirmError"></div>
        </div>

        <div class="field checkboxRow">
          <label class="checkLabel">
            <input id="terms" type="checkbox" />
            I agree to the Terms and Privacy Policy
          </label>
          <div class="error" id="termsError"></div>
        </div>

        <div class="formActions">
          <button class="btn primary" type="submit">Register</button>
          <button class="btn outline" type="button" id="resetBtn">Clear</button>
        </div>

        <div class="success" id="successMsg"></div>

        <p class="smallText">
          Already have an account? <a href="/login">Log in</a>
        </p>
      </form>
    </section>
  </main>

  <script src="/js/register.js"></script>
</body>
</html>
