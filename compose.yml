name: csc342project

services:
  proxy:
    image: nginx:latest
    restart: unless-stopped
    volumes:
      - ./proxy/default.conf.template:/etc/nginx/templates/default.conf.template
    ports:
      - "80:80"

  api:
    build: ./api
    restart: unless-stopped
    volumes:
      - ./api/src:/app/src
    env_file:
      - .env
    depends_on:
      - database
    environment:
      - PORT=80

  frontend:
    build: ./frontend
    restart: unless-stopped
    volumes:
      - ./frontend/src:/app/src
    environment:
      - PORT=80

  database:
    image: mariadb:latest
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootPass
      MYSQL_DATABASE: logindb
      MYSQL_USER: user
      MYSQL_PASSWORD: pass
    volumes:
      - ./database/data:/var/lib/mysql
      - ./database/db_schema:/docker-entrypoint-initdb.d
    ports:
      - "3307:3306"
